<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VKU Field Survey PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e40af">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 antialiased select-none pb-20">

  <!-- Header App -->
  <header class="sticky top-0 bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center z-50">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-building-circle-check text-xl text-yellow-400"></i>
      <div>
        <h1 class="text-base font-bold leading-tight">VKU Field Survey</h1>
        <p class="text-[10px] text-blue-200">Đại học CNTT & TT Việt - Hàn</p>
      </div>
    </div>
    <span id="network-status" class="px-2.5 py-1 text-[11px] rounded-full bg-green-500 font-semibold shadow">Online</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Khối trạng thái đồng bộ -->
    <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 flex justify-between items-center shadow-sm">
      <div class="text-xs text-blue-900">
        <span class="font-bold">Đồng bộ Google Sheets:</span>
        <p id="pending-count" class="text-gray-600">Đang kiểm tra dữ liệu...</p>
      </div>
      <button id="sync-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-transform flex items-center space-x-1">
        <i class="fa-solid fa-rotate"></i>
        <span>Đồng Bộ Ngay</span>
      </button>
    </div>

    <!-- Form Khảo Sát Chi Tiết VKU -->
    <form id="survey-form" class="bg-white p-4 rounded-2xl shadow-sm space-y-4 border border-gray-200">
      <div class="border-b pb-2">
        <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide">Phiếu Kiểm Tra Cơ Sở Vật Chất</h2>
      </div>

      <!-- Thời gian & Khu vực VKU -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Thời Gian Khảo Sát</label>
          <input type="datetime-local" id="survey-date" class="w-full p-2.5 border rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tòa Nhà / Khu Vực (VKU)</label>
          <select id="building" class="w-full p-2.5 border rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" required>
            <option value="">-- Chọn tòa nhà / khu vực --</option>
            <optgroup label="Khu Giảng Đường & Khoa">
              <option value="Khu K - Giảng đường chính">Khu K - Giảng đường & Trung tâm VJIT</option>
              <option value="Khu V - Khoa KHMT">Khu V - Khoa KHMT & Phòng Lab</option>
              <option value="Tòa nhà Hành chính A">Tòa nhà Hành chính A</option>
              <option value="Tòa B - Giảng đường B">Tòa B - Giảng đường B</option>
              <option value="Tòa C - Giảng đường C">Tòa C - Giảng đường C</option>
            </optgroup>
            <optgroup label="Khu Tiện Ích & KTX">
              <option value="Thư viện & Trung tâm Học liệu">Thư viện & Trung tâm Học liệu</option>
              <option value="Ký túc xá Sinh viên">Ký túc xá Sinh viên (Khu KTX)</option>
              <option value="Khu Thể thao / Nhà thi đấu">Khu Thể thao & Nhà thi đấu</option>
              <option value="Căn tin & Khu Nhà xe">Căn tin & Khu vực Nhà xe</option>
            </optgroup>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Vị Trí / Số Phòng Cụ Thể</label>
          <input type="text" id="location" placeholder="Ví dụ: Phòng K.A201, WC Tầng 2 Khu V, Nhà xe KTX..." class="w-full p-2.5 border rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" required>
        </div>
      </div>

      <hr class="border-dashed">

      <!-- Hạng Mục Kiểm Tra Chi Tiết -->
      <div class="space-y-3">
        <h3 class="text-xs font-bold text-blue-900 uppercase">Đánh Giá Hạng Mục Thực Tế</h3>

        <!-- 1. Trang thiết bị phòng học -->
        <div class="bg-gray-50 p-2.5 rounded-xl border space-y-1.5">
          <label class="block text-xs font-bold text-gray-700"><i class="fa-solid fa-fan me-1 text-blue-600"></i> TB Phòng Học (Quạt, Đèn, Điều hòa, Bàn ghế)</label>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="classroom-eq" value="Tốt" checked> Tốt</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="classroom-eq" value="Cần bảo trì"> Bảo trì</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="classroom-eq" value="Hỏng/Thiếu"> Hỏng/Thiếu</label>
          </div>
        </div>

        <!-- 2. Internet & Kết nối -->
        <div class="bg-gray-50 p-2.5 rounded-xl border space-y-1.5">
          <label class="block text-xs font-bold text-gray-700"><i class="fa-solid fa-wifi me-1 text-blue-600"></i> Internet / Wi-Fi VKU & Tín Hiệu</label>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="internet-status" value="Mạnh/Ổn định" checked> Mạnh/Mượt</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="internet-status" value="Yếu/Chập chờn"> Chập chờn</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="internet-status" value="Mất kết nối"> Mất Wi-Fi</label>
          </div>
        </div>

        <!-- 3. Khu vệ sinh (Toilet) -->
        <div class="bg-gray-50 p-2.5 rounded-xl border space-y-1.5">
          <label class="block text-xs font-bold text-gray-700"><i class="fa-solid fa-restroom me-1 text-blue-600"></i> Nhà Vệ Sinh (Nước, Bồn rửa, Giấy)</label>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="toilet-status" value="Sạch/Đủ nước" checked> Sạch/Tốt</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="toilet-status" value="Thiếu nước/Giấy"> Thiếu đồ</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="toilet-status" value="Hỏng thiết bị"> Hỏng hóc</label>
          </div>
        </div>

        <!-- 4. Vệ sinh môi trường -->
        <div class="bg-gray-50 p-2.5 rounded-xl border space-y-1.5">
          <label class="block text-xs font-bold text-gray-700"><i class="fa-solid fa-broom me-1 text-blue-600"></i> Vệ Sinh Môi Trường & Rác Thải</label>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="hygiene-status" value="Sạch sẻ" checked> Sạch sẻ</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="hygiene-status" value="Có rác tồn đọng"> Có rác tồn</label>
            <label class="text-[11px] border p-1.5 rounded-lg bg-white text-center cursor-pointer"><input type="radio" name="hygiene-status" value="Bẩn/Mùi hôi"> Bẩn/Mùi</label>
          </div>
        </div>
      </div>

      <!-- Đánh giá chung -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Đánh Giá Chung Toàn Khu Vực</label>
        <div class="grid grid-cols-3 gap-2">
          <label class="flex flex-col items-center justify-center p-2 border rounded-xl cursor-pointer bg-green-50 border-green-300 text-green-700 font-bold active:scale-95 text-xs">
            <input type="radio" name="status" value="Đạt chuẩn" class="hidden" checked> 
            <i class="fa-solid fa-circle-check mb-0.5"></i> Đạt chuẩn
          </label>
          <label class="flex flex-col items-center justify-center p-2 border rounded-xl cursor-pointer bg-yellow-50 border-yellow-300 text-yellow-700 font-bold active:scale-95 text-xs">
            <input type="radio" name="status" value="Cần xử lý" class="hidden"> 
            <i class="fa-solid fa-triangle-exclamation mb-0.5"></i> Cần xử lý
          </label>
          <label class="flex flex-col items-center justify-center p-2 border rounded-xl cursor-pointer bg-red-50 border-red-300 text-red-700 font-bold active:scale-95 text-xs">
            <input type="radio" name="status" value="Nghiêm trọng" class="hidden"> 
            <i class="fa-solid fa-circle-xmark mb-0.5"></i> Nghiêm trọng
          </label>
        </div>
      </div>

      <!-- Ảnh chụp camera -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Chụp Ảnh Minh Chứng (Camera)</label>
        <input type="file" id="photo" accept="image/*" capture="environment" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
      </div>

      <!-- Ghi chú chi tiết -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Mô Tả Chi Tiết / Sự Cố</label>
        <textarea id="notes" rows="2" placeholder="Ví dụ: Quạt trần số 2 kêu to, Wi-Fi phòng K.A201 không vào được..." class="w-full p-2.5 border rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition-transform flex justify-center items-center space-x-2 text-xs">
        <i class="fa-solid fa-floppy-disk"></i>
        <span>Lưu Báo Cáo Khảo Sát</span>
      </button>
    </form>

    <!-- Danh sách bản ghi ngoại tuyến -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="text-xs font-bold text-gray-500 border-b pb-2 mb-3 uppercase tracking-wider">Danh Sách Báo Cáo Cục Bộ</h2>
      <div id="survey-list" class="space-y-3"></div>
    </section>

  </main>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
